[package]
name = "cargo-toml-generator-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = { workspace = true }
cargo-toml-generator-types = { path = "../cargo-toml-generator-types" }
darling = "0.20" # A helper for parsing macro inputs
serde_json = "1.0"

[build-dependencies]
anyhow = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
