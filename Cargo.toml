[package]
name = "split-decls-rs"
version = "0.1.0"
edition = "2024"
authors = []
build = "build.rs"

# [workspace]
# members = [
#     ".", # This crate itself
#     "cargo-toml-generator-macros",
#     "cargo-toml-generator-types",
