[dependencies]
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true } # Added for build.rs serialization
url = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features= ["full","visit", "visit-mut", "extra-traits"] } # Added extra-traits
walkdir = { workspace = true }
split-decls-types = { workspace = true } # Use workspace dependency
proc-macro2 = { workspace = true }
tempfile = { workspace = true }
cargo-toml-generator-types = { workspace = true } # Use workspace dependency
sha2 = "0.10"
clap = { workspace = true, features = ["derive"] }
cargo-toml-generator-macros = { workspace = true }
cargo-toml-parts = { path = "build_helpers/cargo_toml_parts" }
pagerank_rs = { path = "submodules/pagerank_rs" }



[build-dependencies]
cargo-toml-generator-macros = { workspace = true }
cargo-toml-generator-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
cargo-toml-parts = { path = "build_helpers/cargo_toml_parts" }

[[bin]]
name = "rustmacrodoc"
path = "src/bin/rustmacrodoc.rs"

[[bin]]
name = "testbuild"
path = "src/bin/testbuild.rs"

[[bin]]
name = "macro_analyzer"
path = "src/bin/macro_analyzer.rs"

[[bin]]
name = "test_splitter"
path = "src/bin/test_splitter.rs"

[[bin]]
name = "submodule_decl_report"
path = "src/bin/submodule_decl_report.rs"

[patch.'crates-io']
proc-macro2 = { path = "../proc-macro2" }
