[package]
name = "split-decls-rs-output"
version = "0.1.0"
edition = "2021"

[workspace]
# Empty workspace to exclude from parent

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.0"

[build-dependencies]
anyhow = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
